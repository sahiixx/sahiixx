name: Auto-Update Portfolio Docs

on:
  schedule:
    # Run every Sunday at 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate fresh portfolio
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 generate_portfolio.py > generated_portfolio.md

      - name: Update FULL_PORTFOLIO.md
        run: |
          if [ -s generated_portfolio.md ]; then
            cp generated_portfolio.md FULL_PORTFOLIO.md
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add FULL_PORTFOLIO.md generated_portfolio.md
          git diff --cached --quiet || {
            git commit -m "chore: auto-update portfolio docs [skip ci]"
            git push
          }
