name: hermes-azure-check

# Advisory endpoint check. Until 2026-09-19 this FAILED every push because the
# configured key/endpoint pair returns HTTP 401 — a stale secret must not block
# unrelated work. A non-200 is now reported as a warning annotation + run
# summary instead of failing the build.

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Azure Foundry endpoint
        env:
          AZURE_FOUNDRY_API_KEY: ${{ secrets.AZURE_FOUNDRY_API_KEY }}
          AZURE_FOUNDRY_BASE_URL: ${{ secrets.AZURE_FOUNDRY_BASE_URL }}
          AZURE_FOUNDRY_MODEL: ${{ vars.AZURE_FOUNDRY_MODEL }}
        run: |
          set -uo pipefail
          MODEL="${AZURE_FOUNDRY_MODEL:-gpt-5.6-sol}"

          if [ -z "${AZURE_FOUNDRY_API_KEY:-}" ] || [ -z "${AZURE_FOUNDRY_BASE_URL:-}" ]; then
            echo "Azure Foundry secrets not set - skipping live check"
            {
              echo "## Azure Foundry check"
              echo ""
              echo ":grey_question: Skipped - secrets not configured."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' \
            -H "api-key: $AZURE_FOUNDRY_API_KEY" \
            -H 'Content-Type: application/json' \
            "$AZURE_FOUNDRY_BASE_URL/chat/completions" \
            -d "{\"model\":\"$MODEL\",\"messages\":[{\"role\":\"user\",\"content\":\"ping\"}],\"max_completion_tokens\":16}") || code=000

          body=$(head -c 600 /tmp/out.json 2>/dev/null || true)
          echo "HTTP $code"

          {
            echo "## Azure Foundry check"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| model | \`$MODEL\` |"
            echo "| HTTP | \`$code\` |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$code" = "200" ]; then
            echo "Azure Foundry OK (HTTP 200)"
            echo ":white_check_mark: Healthy (HTTP 200)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "response: $body"
          echo "::warning title=Azure Foundry endpoint unhealthy::HTTP $code - rotate AZURE_FOUNDRY_API_KEY or fix AZURE_FOUNDRY_BASE_URL. Advisory only; not failing the build."
          {
            echo ":warning: **Unhealthy** (HTTP \`$code\`) - advisory, build not failed"
            echo ""
            echo '```'
            echo "$body"
            echo '```'
            echo "Rotate \`AZURE_FOUNDRY_API_KEY\` or correct \`AZURE_FOUNDRY_BASE_URL\`."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0